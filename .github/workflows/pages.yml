name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Activar GitHub Pages si aún no lo está
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar solo los archivos del sitio
        run: |
          mkdir -p _site
          cp -r index.html css js img robots.txt sitemap.xml llms.txt _site/

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
