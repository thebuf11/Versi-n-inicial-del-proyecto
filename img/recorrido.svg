<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t1">
  <title id="t1">Mi recorrido: de la ESO a primero de DAM</title>
  <!-- Tarjeta de fondo propia: así se lee igual en modo claro y oscuro -->
  <rect x="2" y="2" width="636" height="256" rx="24" fill="#fffdf9" stroke="#d9d3c7" stroke-width="2"/>
  <text x="40" y="52" font-family="Geist, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#14110f">Mi recorrido<tspan fill="#ff7a1a">.</tspan></text>

  <!-- Línea base gris y tramo recorrido en naranja -->
  <line x1="80" y1="128" x2="560" y2="128" stroke="#d9d3c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="128" x2="560" y2="128" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- Hitos: círculo con número -->
  <g font-family="Geist, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="80" cy="128" r="16" fill="#fffdf9" stroke="#14110f" stroke-width="3"/>
    <text x="80" y="133" fill="#14110f">1</text>
    <circle cx="200" cy="128" r="16" fill="#fffdf9" stroke="#14110f" stroke-width="3"/>
    <text x="200" y="133" fill="#14110f">2</text>
    <circle cx="320" cy="128" r="16" fill="#fffdf9" stroke="#14110f" stroke-width="3"/>
    <text x="320" y="133" fill="#14110f">3</text>
    <circle cx="440" cy="128" r="16" fill="#fffdf9" stroke="#14110f" stroke-width="3"/>
    <text x="440" y="133" fill="#14110f">4</text>
    <!-- El último hito, «hoy», destaca en naranja con un halo -->
    <circle cx="560" cy="128" r="26" fill="#ffe3cc"/>
    <circle cx="560" cy="128" r="18" fill="#ff7a1a"/>
    <text x="560" y="133" fill="#14110f">5</text>
  </g>

  <!-- Etiquetas de cada hito -->
  <g font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="80" y="186" font-size="15" font-weight="700" fill="#14110f">ESO</text>
    <text x="80" y="206" font-size="12" fill="#665f57">Salesianos</text>
    <text x="200" y="186" font-size="15" font-weight="700" fill="#14110f">Grado Medio</text>
    <text x="200" y="206" font-size="12" fill="#665f57">SMR · prácticas</text>
    <text x="320" y="186" font-size="15" font-weight="700" fill="#14110f">Grado Superior</text>
    <text x="320" y="206" font-size="12" fill="#665f57">Ventas</text>
    <text x="440" y="186" font-size="15" font-weight="700" fill="#14110f">Empresas</text>
    <text x="440" y="206" font-size="12" fill="#665f57">Marketing y admin.</text>
    <text x="560" y="186" font-size="15" font-weight="700" fill="#c2410c">Hoy</text>
    <text x="560" y="206" font-size="12" fill="#665f57">Primero de DAM</text>
  </g>

  <!-- Años conocidos, encima de su hito -->
  <g font-family="Geist, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#665f57" text-anchor="middle">
    <text x="200" y="92">2018</text>
    <text x="440" y="92">2022-2024</text>
  </g>
</svg>
